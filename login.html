<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Grid's Eye View — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      background: #0a0f1a;
      color: #e8edf4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: 100%;
      max-width: 340px;
      background: #101725;
      border: 1px solid #1e2b40;
      border-radius: 8px;
      padding: 28px 26px 26px;
    }
    .login-title {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .login-sub {
      margin: 0 0 22px;
      font-size: 12px;
      color: #7c8aa0;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0a0f1a;
      border: 1px solid #29374d;
      border-radius: 5px;
      color: #e8edf4;
      font-size: 14px;
      padding: 9px 11px;
      margin-bottom: 16px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #64748b;
    }
    button {
      width: 100%;
      background: #e8edf4;
      color: #0a0f1a;
      border: 0;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 10px;
      cursor: pointer;
    }
    button:hover { background: #ffffff; }
    .login-error {
      display: none;
      margin: 0 0 14px;
      font-size: 12px;
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 5px;
      padding: 8px 10px;
    }
    .login-error.show { display: block; }
  </style>
</head>
<body>
  <form class="login-box" id="loginForm" autocomplete="off">
    <h1 class="login-title">GRID'S EYE VIEW</h1>
    <p class="login-sub">Restricted access — authorized users only.</p>

    <div class="login-error" id="loginError" role="alert">
      Incorrect username or password.
    </div>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />

    <button type="submit">Sign in</button>
  </form>

  <script>
    (function () {
      // NOTE: this is a client-side gate only — it keeps casual visitors out,
      // it is not real authentication. The credentials below are visible to
      // anyone who views source.
      var USER = 'creator300';
      var PASS = 'ski123';
      var FLAG = 'gev_loggedin';

      // Already signed in? skip straight to the app.
      try {
        if (localStorage.getItem(FLAG)) {
          window.location.replace('/index.html');
          return;
        }
      } catch (e) {}

      var form = document.getElementById('loginForm');
      var errorEl = document.getElementById('loginError');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value;

        if (u === USER && p === PASS) {
          try { localStorage.setItem(FLAG, '1'); } catch (e) {}
          window.location.replace('/index.html');
        } else {
          errorEl.classList.add('show');
          document.getElementById('password').value = '';
        }
      });
    })();
  </script>
</body>
</html>
